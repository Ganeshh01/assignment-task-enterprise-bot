name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-scan:
    name: Lint Chart & Scan Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Microservice Helm Chart
        run: |
          helm lint ./chart

      - name: Lint Lab Helm Chart
        run: |
          helm lint ./lab/broken-chart

      - name: Build Microservice Docker Image
        run: |
          docker build -t demo-service:ci ./service

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'demo-service:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
